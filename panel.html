<!DOCTYPE html>
<html>
<head>
  <style>
    body { 
      background-color: #000000; 
      color: #ffffff; 
      font-family: 'Segoe UI', Tahoma, sans-serif; 
      text-align: center; 
      padding: 2px; 
      margin: 0; 
      overflow: hidden; 
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .controls { 
      display: flex; 
      justify-content: center; 
      gap: 3px; 
      margin-top: 2px;
      margin-bottom: 4px; 
      width: 100%;
    }

    select, #sync-btn { 
      background: #1a1a1a; 
      color: white; 
      border: 1px solid #333; 
      padding: 1px 3px; 
      border-radius: 2px; 
      font-size: 9px; 
      outline: none; 
      cursor: pointer; 
    }
    
    #sync-btn { background: #f59e0b; color: #000; font-weight: bold; }

  
    #mini-board {
      display: grid !important; 
      grid-template-columns: repeat(8, 1fr) !important; 
      grid-template-rows: repeat(8, 1fr) !important;
      width: 160px;  /* SUPER TINY */
      height: 160px; /* SUPER TINY */
      border: 1px solid #2a2a2a; 
      background-color: #1a1a1a;
      line-height: 0; 
    }
    
    .square { 
      width: 20px; 
      height: 20px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }

    .square img { 
      width: 90%; 
      height: 90%; 
      pointer-events: none; 
    }
    
    .light { background-color: #ebecd0; }
    .dark { background-color: #739552; }
    .highlight-move { background-color: rgba(245, 158, 11, 0.8) !important; box-shadow: inset 0 0 2px #fff; }
    

    #best-move-text { 
      font-size: 16px; 
      font-weight: 900; 
      color: #4ade80; 
      margin-top: 4px; 
      letter-spacing: 1px;
      min-height: 20px; 
    }
  </style>
</head>
<body>

  
  <div class="controls">
    <select id="player-color">
      <option value="w">White</option>
      <option value="b" selected>Black</option>
    </select>
    
    <select id="elo-level">
      <option value="1300">1300</option>
      <option value="1700" selected>1700</option>
      <option value="2200">2200</option>
      <option value="MAX">MAX</option>
    </select>

    <button id="sync-btn">Sync</button>
  </div>

  
  <div id="mini-board"></div>
  

  <div id="best-move-text"></div>

  <script src="panel.js"></script>
</body>
</html>
